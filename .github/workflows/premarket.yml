name: 盘前更新

# 北京时间 10:30（本地 09:26 之后）：拿隔夜美股 + 亚洲早盘 + A 股集合竞价，
# 更新「今日开盘应对」，重建看板并发布。
#
# ⚠️ 为什么现在能自动兜底了：
#   以前云端没法判断「本机 09:26 跑没跑」—— 本机 premarket 只写 premarket.json、
#   不重建 index.html，所以没有任何仓库可见的标记。现在 run-premarket.cmd 会依次跑
#   premarket.mjs → build-dashboard.mjs → deploy-pages.mjs，于是 version.json 会被刷新，
#   云端就能像 daily.yml 那样用一个 gate 判断本机是否已经跑过。
#
# ⚠️ 排在 10:30 而不是 09:26：本机 09:26 先跑，云端错开 1 小时。
#   本机跑成了 → version.json 是今天的 → 云端跳过。
#   本机没跑成（任务没触发 / 跑到一半被杀）→ version.json 还停在昨天 → 云端接手。
on:
  schedule:
    # 北京时间 10:30 = 02:30 UTC
    - cron: '30 2 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略「本机今天已经跑过」的检查，强制在云端跑一遍'
        type: boolean
        default: false

concurrency:
  group: astock-update
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  PYTHONIOENCODING: utf-8
  BUILD_KIND: premarket # 让 version.json 标明这次是盘前构建，别让下午的云端日更误判成已完成

jobs:
  premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 检查本机今天是否已经跑过盘前
        id: fresh
        run: |
          # 只认 kind=premarket 的今天构建 —— 盘前这一路要判断的是「本机盘前跑没跑」。
          # 之前写成「今天有过任何构建就跳过」，那样早上只要有人手动 rebuild 一次
          # （kind 默认 daily），云端盘前就会被误判成已完成。
          stamp=$(grep -o '"generatedAt":"[^"]*"' version.json 2>/dev/null | head -1 | cut -d'"' -f4)
          kind=$(grep -o '"kind":"[^"]*"' version.json 2>/dev/null | head -1 | cut -d'"' -f4)
          d_bj=$(date +%F); d_utc=$(date -u +%F)
          echo "version.json generatedAt=${stamp:-读取失败} kind=${kind:-无}  今天(北京)=$d_bj 今天(UTC)=$d_utc  force=${{ inputs.force }}"
          if [ '${{ inputs.force }}' = 'true' ]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"; echo '→ 手动指定 force，照常在云端运行'
          elif [ "$kind" = 'premarket' ] && { [ "${stamp:0:10}" = "$d_bj" ] || [ "${stamp:0:10}" = "$d_utc" ]; }; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"; echo '→ 本机今天的盘前已经跑过，云端跳过'
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"; echo "→ 本机今天没跑盘前（kind=${kind:-无}），云端接手（兜底）"
          fi

      - uses: actions/setup-node@v4
        if: steps.fresh.outputs.fresh != 'true'
        with:
          node-version: '24'

      - name: 盘前更新 + 重建看板
        id: gen
        if: steps.fresh.outputs.fresh != 'true'
        continue-on-error: true
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
        run: |
          set -o pipefail
          {
            node premarket.mjs
            # 归档只写进 push-archive.json，必须重建才有 index.html 的新版本
            node build-dashboard.mjs
            cp astock-dashboard.html index.html
          } 2>&1 | tee premarket-run.log

      - name: 提交并推送
        if: always() && steps.fresh.outputs.fresh != 'true'
        run: |
          git config user.name  'astock-bot'
          git config user.email 'astock-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo '无改动，跳过提交'
          else
            git commit -q -m "云端盘前 $(date +'%Y-%m-%d %H:%M') （run ${{ github.run_number }}）"
            git push || { git pull --rebase --autostash && git push; }
          fi

      - name: 运行摘要
        if: always()
        run: |
          {
            echo "## 盘前更新"
            echo ""
            echo "- 时间：$(date +'%Y-%m-%d %H:%M:%S %Z')"
            if [ '${{ steps.fresh.outputs.fresh }}' = 'true' ]; then
              echo "- **本机今天已经构建过看板，云端跳过**（本机为主、云端兜底）"
            else
              echo "- 生成步骤：${{ steps.gen.outcome }}"
            fi
            echo ""
            if [ -f premarket-run.log ]; then
              echo '```'
              tail -40 premarket-run.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 留存日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premarket-run-log
          path: premarket-run.log
          if-no-files-found: ignore
          retention-days: 14
